apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodeapp-demo1-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nodeapp-demo1
  template:
    metadata:
      labels:
        app: nodeapp-demo1
    spec:
      containers:
      - name: nodeapp-demo1
        image: rk0617/nodeapp-demo1:v1.1.0
        ports:
        - containerPort: 3000
        resources:
          requests:
            cpu: "250m"        # Minimum CPU guaranteed (0.25 CPU)
            memory: "256Mi"    # Minimum memory guaranteed
          limits:
            cpu: "500m"        # Maximum CPU allowed (0.5 CPU)
            memory: "512Mi"    # Maximum memory allowed


        # Startup probe - gives app time to initialize before liveness check
        startupProbe:
          httpGet:
            path: /health
            port: 3000
          failureThreshold: 30    # retry 30 times before marking unhealthy
          periodSeconds: 10       # check every 10 seconds

        # Readiness probe - checks if pod can receive traffic
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3

        # Liveness probe - checks if pod is alive
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 20
          failureThreshold: 3
